<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원사 전용 | AI 골드 러쉬 파트너스</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts - Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 헤더는 header.js에서 자동으로 삽입됩니다 -->
    
    <!-- 메인 컨텐츠 -->
    <main>
        <!-- 로그인 섹션 -->
        <section class="section login-section">
            <div class="container">
                <div class="row">
                    <div class="col-6 offset-3">
                        <div class="login-card">
                            <h2 class="section-title">회원사 로그인</h2>
                            <form class="login-form" action="member2.html" method="get">
                                <div class="form-group">
                                    <label for="memberID">아이디</label>
                                    <input type="text" id="memberID" name="memberID" class="form-control" placeholder="회원사 아이디를 입력하세요">
                                </div>
                                <div class="form-group">
                                    <label for="password">비밀번호</label>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요">
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" id="rememberLogin" class="form-check-input">
                                    <label for="rememberLogin" class="form-check-label">로그인 상태 유지</label>
                                </div>
                                <div class="login-buttons">
                                    <button type="submit" class="btn btn-primary btn-block">로그인 (누르면 로그인 후 페이지 이동)</button>
                                </div>
                                <div class="login-links">
                                    <a href="#" class="text-link">아이디 찾기</a>
                                    <span class="divider">|</span>
                                    <a href="#" class="text-link">비밀번호 찾기</a>
                                </div>
                            </form>
                        </div>
                        <div class="non-member-section">
                            <h3>회원사가 아니신가요?</h3>
                            <p>한국인공지능협회 회원사만 이용 가능한 서비스입니다. 협회 가입을 통해 다양한 혜택을 받아보세요.</p>
                            <a href="#" class="btn btn-secondary">협회 가입 안내</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>
    
    <!-- 푸터는 footer.js에서 자동으로 삽입됩니다 -->

    <!-- JavaScript 파일 -->
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
